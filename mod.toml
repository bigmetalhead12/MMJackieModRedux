[[manifest.config_options]]
id = "_recomp_texture_pack_enabled"
name = "Enable HD Textures"
description = """
Toggle on to enable HD textures for Jackie.
"""
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "change_hairstyle"
name = "Change Hairstyle"
description = """
Toggle to change the hairstyle (Default or Ponytail)

Note that the ponytail uses real-time physics, and its performance may vary based on your PC's hardware.
"""
type = "Enum"
options = [ "Default", "Ponytail" ]
default = "Default"

[[manifest.config_options]]
id = "change_outfit"
name = "Change Outfit"
description = """
Toggle to change the outfit (Default or Cadet)

Note that the Cadet costume uses real-time physics, and its performance may vary based on your PC's hardware.
"""
type = "Enum"
options = [ "Default", "Cadet" ]
default = "Default"

[[manifest.config_options]]
id = "alternative_text"
name = "Change Text"
description = """
Toggle to change the text (Default or Alternative)
"""
type = "Enum"
options = [ "Default", "Alternative" ]
default = "Default"

